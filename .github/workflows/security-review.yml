name: Security Review & SAST Policy Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Common Security Dependencies
        run: |
          cd AidailycashE2E && npm install
          cd ../server && npm install exceljs

      - name: Run Web Frontend Security Suite
        run: |
          cd AidailycashE2E
          node scripts/generateWebSecuritySuite.js

      - name: Run Backend API Security Suite
        run: |
          cd server
          node scripts/generateSecuritySuite.js

      - name: Enforce Zero-Critical Security Policy Gate
        run: |
          echo "Verifying Zero-Critical security threshold..."
          WEB_CRIT=0
          BACKEND_CRIT=0
          if [ -f "AidailycashE2E/Security_Reports/Web/web-security-review.md" ]; then
            VAL=$(grep -oEi "Critical:\s*[0-9]+" AidailycashE2E/Security_Reports/Web/web-security-review.md | grep -oE "[0-9]+" | head -n 1 || echo "0")
            WEB_CRIT=${VAL:-0}
          fi
          if [ -f "server/Security_Reports/Backend/security-review.md" ]; then
            VAL=$(grep -oEi "Critical:\s*[0-9]+" server/Security_Reports/Backend/security-review.md | grep -oE "[0-9]+" | head -n 1 || echo "0")
            BACKEND_CRIT=${VAL:-0}
          fi
          echo "Web Critical Count: $WEB_CRIT"
          echo "Backend Critical Count: $BACKEND_CRIT"
          if [ "$WEB_CRIT" -gt 0 ] || [ "$BACKEND_CRIT" -gt 0 ]; then
            echo "❌ SECURITY GATE FAILED: Critical vulnerabilities detected ($WEB_CRIT Web, $BACKEND_CRIT Backend)."
            exit 1
          else
            echo "✅ SECURITY GATE PASSED: Zero critical vulnerabilities detected."
          fi

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            AidailycashE2E/Security_Reports/
            server/Security_Reports/

      - name: Append Summaries to GITHUB_STEP_SUMMARY
        if: always()
        run: |
          echo "# 🛡️ Automated Security Review Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "AidailycashE2E/Security_Reports/Web/web-executive-summary.md" ]; then
            cat AidailycashE2E/Security_Reports/Web/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "server/Security_Reports/Backend/executive-summary.md" ]; then
            cat server/Security_Reports/Backend/executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
