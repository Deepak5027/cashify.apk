name: Security Review & SAST Policy Gate

on:
  push:
    paths:
      - 'Aidailycashmanagement-main/**'
      - 'AidailycashE2E/**'
      - 'aifinancify_flutter/**'
  pull_request:
    paths:
      - 'Aidailycashmanagement-main/**'
      - 'AidailycashE2E/**'
      - 'aifinancify_flutter/**'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Common Security Scanning Dependencies
        working-directory: ./AidailycashE2E
        run: npm install exceljs

      - name: Run Web Frontend Security Suite
        working-directory: ./AidailycashE2E
        env:
          NODE_PATH: ./node_modules
        run: node scripts/generateWebSecuritySuite.js

      - name: Run Backend API Security Suite
        working-directory: ./Aidailycashmanagement-main/server
        env:
          NODE_PATH: ../../AidailycashE2E/node_modules
        run: node scripts/generateSecuritySuite.js

      - name: Enforce Zero-Critical Security Policy Gate
        run: |
          echo "Verifying Zero-Critical security threshold..."
          
          # Check Web Security Findings
          WEB_CRITICAL=$(grep -i "Critical:" AidailycashE2E/Security_Reports/Web/web-security-review.md | grep -oE "Critical: [0-9]+" | awk '{print $2}' || echo "0")
          
          # Check Backend Security Findings
          BACKEND_CRITICAL=$(grep -i "Critical:" Aidailycashmanagement-main/server/Security_Reports/Backend/security-review.md | grep -oE "Critical: [0-9]+" | awk '{print $2}' || echo "0")
          
          echo "Web Critical Count: $WEB_CRITICAL"
          echo "Backend Critical Count: $BACKEND_CRITICAL"

          if [ "$WEB_CRITICAL" -gt "0" ] || [ "$BACKEND_CRITICAL" -gt "0" ]; then
            echo "❌ SECURITY GATE FAILED: Critical vulnerabilities detected ($WEB_CRITICAL Web, $BACKEND_CRITICAL Backend)."
            exit 1
          else
            echo "✅ SECURITY GATE PASSED: Zero critical vulnerabilities detected."
          fi

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            AidailycashE2E/Security_Reports/
            Aidailycashmanagement-main/server/Security_Reports/

      - name: Append Summaries to GITHUB_STEP_SUMMARY
        if: always()
        run: |
          echo "# 🛡️ Automated Security Review Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "AidailycashE2E/Security_Reports/Web/web-executive-summary.md" ]; then
            cat AidailycashE2E/Security_Reports/Web/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "Aidailycashmanagement-main/server/Security_Reports/Backend/executive-summary.md" ]; then
            cat Aidailycashmanagement-main/server/Security_Reports/Backend/executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
