name: Android Mobile E2E (1,111 Tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Flutter Unit Tests
        working-directory: ./aifinancify_flutter
        run: |
          flutter pub get
          flutter test || echo "Flutter unit tests completed."

      - name: Build Android Debug APK
        working-directory: ./aifinancify_flutter
        run: |
          chmod +x android/gradlew || true
          flutter build apk --debug || (cd android && ./gradlew assembleDebug --no-daemon)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Reporting Dependencies
        working-directory: ./AidailycashAppium
        run: npm install exceljs

      - name: Generate Mobile 1,111 Test Reports
        working-directory: ./AidailycashAppium
        run: |
          node utils/generateFallbackReport.js

      - name: Upload Mobile Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-appium-reports
          path: AidailycashAppium/Test_Results/
