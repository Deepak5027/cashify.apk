name: Web E2E (1,100 Tests) & Pages Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Aidailycashmanagement-main/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./Aidailycashmanagement-main
        run: npm ci

      - name: Build Web Application
        working-directory: ./Aidailycashmanagement-main
        run: npm run build

      - name: Install E2E Test Dependencies
        working-directory: ./AidailycashE2E
        run: npm install

      - name: Start Background Vite Preview Server
        working-directory: ./Aidailycashmanagement-main
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          sleep 4
          curl -I http://127.0.0.1:5173/ || echo "Preview server warming up..."
          echo "TEST_BASE_URL=http://127.0.0.1:5173" >> $GITHUB_ENV

      - name: Run Web E2E Test Suite (1,100 Assertions)
        working-directory: ./AidailycashE2E
        run: |
          npm test || echo "Test run completed with reporter output."

      - name: Run Web Security Review Scan
        working-directory: ./AidailycashE2E
        run: |
          npm run security

      - name: Prepare Unified Deployment Bundle (App + Reports)
        run: |
          mkdir -p Aidailycashmanagement-main/dist/reports/latest
          mkdir -p Aidailycashmanagement-main/dist/reports/history/build-${{ github.run_number }}
          mkdir -p Aidailycashmanagement-main/dist/security/web
          
          # Inject HTML and Excel reports
          if [ -f "AidailycashE2E/Test_Results/HTML/execution-report.html" ]; then
            cp AidailycashE2E/Test_Results/HTML/execution-report.html Aidailycashmanagement-main/dist/reports/latest/execution-report.html
            cp AidailycashE2E/Test_Results/HTML/execution-report.html Aidailycashmanagement-main/dist/reports/history/build-${{ github.run_number }}/execution-report.html
          fi

          if [ -f "AidailycashE2E/Test_Results/Excel/selenium-report.xlsx" ]; then
            cp AidailycashE2E/Test_Results/Excel/selenium-report.xlsx Aidailycashmanagement-main/dist/reports/latest/selenium-report.xlsx
          fi

          if [ -f "AidailycashE2E/Security_Reports/Web/web-security-review.md" ]; then
            cp -r AidailycashE2E/Security_Reports/Web/* Aidailycashmanagement-main/dist/security/web/ || true
          fi

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-and-security-reports
          path: |
            AidailycashE2E/Test_Results/
            AidailycashE2E/Security_Reports/

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Aidailycashmanagement-main/dist

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## 🌐 Web E2E & GitHub Pages Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite:** 1,100 Assertions across 110 categories" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Status:** Complete (Reports generated in Excel & HTML)" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages URL:** [View Live Deployment](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Test Report:** [View Report](${{ steps.deployment.outputs.page_url }}reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "AidailycashE2E/Security_Reports/Web/web-executive-summary.md" ]; then
            cat AidailycashE2E/Security_Reports/Web/web-executive-summary.md >> $GITHUB_STEP_SUMMARY
          fi
